name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # criar a release
      id-token: write     # atestado de origem (provenance)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # build de release sempre do zero
      - name: Testes e vulnerabilidades
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Compilar
        env:
          CGO_ENABLED: "0"
          V: ${{ github.ref_name }}
        run: |
          LDF="-s -w -buildid= -X main.version=${V}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDF" -o dist/pzlink-windows.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDF" -o dist/pzlink-linux .
          cd dist && sha256sum pzlink-windows.exe pzlink-linux > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Atestado de origem
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pzlink-windows.exe
            dist/pzlink-linux
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$V" in *-*) PRE="--prerelease" ;; esac
          gh release create "$V" dist/* --title "PZLink $V" --generate-notes $PRE
